name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install actionlint 1.7.12
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Lint workflows and embedded shell commands
        run: '"$RUNNER_TEMP/actionlint" -color -shellcheck=shellcheck'

  clazy:
    name: Clazy Qt analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Qt and Clazy
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential qtbase5-dev qt5-qmake clazy clang-15

      - name: Analyze the production application
        run: bash scripts/ci-linux-clazy.sh

  project-parity:
    name: qmake and Visual Studio project parity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compare source and header lists
        run: python3 scripts/check_vcxproj_parity.py

  linux-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux build and tests
            script: scripts/ci-linux.sh
            sanitizers: false
          - name: Linux ASan and UBSan
            script: scripts/ci-linux-sanitizers.sh
            sanitizers: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential qtbase5-dev qt5-qmake libqt5sql5-sqlite tzdata

      - name: Install Clang and sanitizer runtimes
        if: matrix.sanitizers
        run: |
          sudo apt-get install --no-install-recommends -y \
            clang-18 libclang-rt-18-dev llvm-18

      - name: Build and run both test suites
        env:
          CI_SCRIPT: ${{ matrix.script }}
        run: bash "$CI_SCRIPT"
